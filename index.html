<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=s, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./style/normalize.css">
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="container">
            <header class="sidebar__header">
                <button class="sidebar__btn">
                    <span class="sidebar__btn-line"></span>
                    <span class="sidebar__btn-line"></span>
                </button>
            </header>
            <div class="sidebar__filters">
                <h2 class="sidebar__filters-title">
                    Period
                </h2>
                <select name="" id="" class="sidebar__filtres-select">
                    <option value="0" class="sidebar__filters-option">January</option>
                    <option value="1" class="sidebar__filters-option">February</option>
                    <option value="2" class="sidebar__filters-option">March</option>
                    <option value="3" class="sidebar__filters-option">April</option>
                    <option value="4" class="sidebar__filters-option">May</option>
                    <option value="5" class="sidebar__filters-option">June</option>
                    <option value="6" class="sidebar__filters-option">July</option>
                    <option value="7" class="sidebar__filters-option">August</option>
                    <option value="8" class="sidebar__filters-option">September</option>
                    <option value="9" class="sidebar__filters-option">October</option>
                    <option value="10" class="sidebar__filters-option">November</option>
                    <option value="11" class="sidebar__filters-option">December</option>
                </select>
                <select name="" id="" class="sidebar__filtres-select">
                    <option value="2025" class="sidebar__filters-option">2025</option>
                    <option value="2026" class="sidebar__filters-option">2026</option>
                    <option value="2027" class="sidebar__filters-option">2027</option>
                </select>
            </div>
            <nav class="sidebar__nav nav">
                <a href="#project" class="nav__link">Project</a>
                <a href="#employees" class="nav__link">Employees</a>
            </nav>
        </div>
    </aside>
    <script src="./scripts/script.js"></script>
</body>
</html>
